# type: worker (Background Worker) la lua chon DUNG BAN CHAT cho bot polling
# nay, nhung Render KHONG cho tao worker tren goi Free ("service type is not
# available for this plan" - da gap thuc te, worker can goi Starter tra phi
# tro len). Nen danh cho goi Free: giu type: web + healthcheck HTTP du phong
# trong bot/main.py (bat bien PORT Render tu cap) de qua duoc vong quet port.
#
# NHUOC DIEM: Web Service goi Free tu "ngu" (spin down) sau ~15 phut KHONG
# CO REQUEST HTTP nao goi den - va se khong co ai tu goi vao (bot chi poll
# Telegram RA NGOAI, khong nhan request tu ai). Khi ngu, CA TIEN TRINH bot
# dung hoan toan (ca polling Telegram, ca lich quet 15h05/tin tuc hang gio).
# BAT BUOC phai dung mot dich vu ping dinh ky mien phi (vd UptimeRobot) goi
# vao <URL_RENDER>/healthz moi 5-10 phut de giu bot luon thuc - xem README.md
# muc 7.3.
services:
  - type: web
    name: bot-phan-tich
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
      # Chat id tu dang ky ban tin (tin tuc + /biendong) moi lan khoi dong -
      # goi Free xoa CSDL moi lan restart. Dien trong tab Environment.
      - key: AUTO_SUBSCRIBE_CHAT_IDS
        sync: false
      # Cau hinh nhe cho goi Free (512 MB RAM, KHONG co dia luu ben vung: moi
      # lan restart bot phai nap lai kho). Vu tru rut gon 300 ma thanh khoan
      # nhat, 400 phien/ma (van du cho moi chi bao: RSI thich ung can 252).
      - key: UNIVERSE_MAX_SYMBOLS
        value: "300"
      - key: MARKET_COUNT_BACK
        value: "400"
      - key: SNAPSHOT_MAX_WORKERS
        value: "1"
