[project]
name = "dnse-openapi-sdk-vendored"
version = "0.0.0"
description = "Vendor cuc bo cua dnse-tech/openapi-sdk (python/dnse) - chua co tren PyPI"
requires-python = ">=3.10"
dependencies = [
    "urllib3>=2.0",
    "certifi",
    "websockets>=12.0",
    "msgpack>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dnse", "dnse.api", "dnse.websocket"]
